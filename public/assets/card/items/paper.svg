<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 封面渐变 -->
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A4A2A" />
      <stop offset="100%" stop-color="#4A2510" />
    </linearGradient>
    <!-- 内页渐变 -->
    <linearGradient id="pageGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8F3E8" />
      <stop offset="100%" stop-color="#E5DCC8" />
    </linearGradient>
    <!-- UI投影 -->
    <filter id="uiShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 封皮 -->
  <rect x="12" y="6" width="40" height="50" rx="3" fill="url(#coverGrad)" filter="url(#uiShadow)"
    stroke="#2E1506" stroke-width="1.5" />

  <!-- 内页堆叠（体现厚度） -->
  <rect x="14" y="8" width="36" height="46" rx="2" fill="#E8DFC8" stroke="#B8A88A"
    stroke-width="0.5" />
  <rect x="13" y="9" width="34" height="44" rx="1.5" fill="url(#pageGrad)" />

  <!-- 书脊与装订线 -->
  <rect x="12" y="6" width="3" height="50" rx="1" fill="#3A1D04" />
  <line x1="13.5" y1="14" x2="13.5" y2="48" stroke="#5C331A" stroke-width="1" stroke-dasharray="3,2" />

  <!-- 日志文字占位线 -->
  <line x1="19" y1="18" x2="43" y2="18" stroke="#C4B59A" stroke-width="1.2" stroke-linecap="round" />
  <line x1="19" y1="24" x2="43" y2="24" stroke="#C4B59A" stroke-width="1.2" stroke-linecap="round" />
  <line x1="19" y1="30" x2="35" y2="30" stroke="#C4B59A" stroke-width="1.2" stroke-linecap="round" />
  <line x1="19" y1="36" x2="41" y2="36" stroke="#C4B59A" stroke-width="1.2" stroke-linecap="round" />
  <line x1="19" y1="42" x2="43" y2="42" stroke="#C4B59A" stroke-width="1.2" stroke-linecap="round" />
  <line x1="19" y1="48" x2="28" y2="48" stroke="#C4B59A" stroke-width="1.2" stroke-linecap="round" />

  <!-- 书签丝带 -->
  <path d="M 36 6 L 40 6 L 40 24 L 38 22 L 36 24 Z" fill="#B22222" stroke="#8B1515"
    stroke-width="0.5" />
  <circle cx="38" cy="10" r="1.5" fill="#FFD700" />
</svg>