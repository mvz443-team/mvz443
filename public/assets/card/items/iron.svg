  <path d="M10 30 L38 30 L38 46 L10 46 Z" fill="url(#if)" stroke="#dbe6ec" stroke-width="2" stroke-linejoin="round"/>
  <!-- 右侧面 -->
  <path d="M38 30 L54 22 L54 38 L38 46 Z" fill="url(#is)" stroke="#c4d2da" stroke-width="2" stroke-linejoin="round"/>
  <!-- 金属高光 -->
  <path d="M14 34 L33 34" fill="none" stroke="#eaf4fa" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
