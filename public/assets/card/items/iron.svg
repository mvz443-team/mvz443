<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="it" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9fc"/>
      <stop offset="1" stop-color="#b6c4cc"/>
    </linearGradient>
    <linearGradient id="if" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aebbc3"/>
      <stop offset="1" stop-color="#6b7a83"/>
    </linearGradient>
    <linearGradient id="is" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b9aa2"/>
      <stop offset="1" stop-color="#515f67"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="10" fill="#1d2328"/>
  <!-- 后方铁锭（露出顶部） -->
  <path d="M14 20 L27 14 L50 14 L38 20 Z" fill="url(#it)" stroke="#dbe7ee" stroke-width="2" stroke-linejoin="round"/>
