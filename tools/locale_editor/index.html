<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locale Editor</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ef;
      --panel: #ffffff;
      --ink: #1f1b16;
      --muted: #6b6358;
      --accent: #c0583f;
      --border: #e2dbd1;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 10% 10%, #fff6e8, var(--bg));
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
    }

    header .field {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    label {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fffdfa;
      color: var(--ink);
    }

    input[type="file"] {
      padding: 6px 4px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary {
      background: #eadfd4;
      color: var(--ink);
    }

    #saveAsBtn {
      padding: 10px 20px;
      min-width: 110px;
      font-size: 14px;
    }

    button:disabled {
      background: #c9b7b1;
      cursor: not-allowed;
    }

    main {
      padding: 20px 28px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 92px;
      max-height: calc(100vh - 120px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 12px 16px;
      box-shadow: var(--shadow);
      margin-left: -16px;
    }

    .sidebar h2 {
      margin: 0 0 8px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sidebar .tree {
      border: none;
      box-shadow: none;
      padding: 0 4px 0 0;
    }

    .sidebar .leaf-key {
      font-weight: 500;
      color: var(--muted);
      font-size: 13px;
    }

    .sidebar a {
      color: inherit;
      text-decoration: none;
    }

    .sidebar .nav-item {
      padding: 4px 6px;
      border-radius: 8px;
    }

    .sidebar .nav-item.active {
      background: #f1e7dd;
      color: var(--ink);
      font-weight: 600;
    }

    .tree {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
    }

    details {
      border-left: 2px solid #efe7dc;
      margin-left: 12px;
      padding-left: 12px;
    }

    details>summary {
      list-style: none;
      cursor: pointer;
      padding: 6px 0;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    details>summary::-webkit-details-marker {
      display: none;
    }

    .node-meta {
      color: var(--muted);
      font-size: 12px;
      margin-left: 8px;
    }

    .node-toggle {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(-45deg);
      transition: transform 0.15s ease;
      margin-right: 2px;
    }

    details[open]>summary .node-toggle {
      transform: rotate(45deg);
    }

    .leaf {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px dashed #efe7dc;
    }

    .leaf:last-child {
      border-bottom: none;
    }

    .leaf-key {
      font-weight: 600;
      color: var(--ink);
      word-break: break-all;
    }

    textarea,
    .leaf input[type="text"],
    .leaf input[type="number"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      resize: none;
      overflow: hidden;
      min-height: 40px;
      background: #fffdfa;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      header {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        max-height: none;
      }

      .leaf {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="field">
      <label for="fileInput">Import File</label>
      <input id="fileInput" type="file" accept="application/json" />
    </div>
    <div class="field">
      <label for="pathInput">Current File Path</label>
      <input id="pathInput" type="text" readonly />
      <button id="saveAsBtn" class="secondary" disabled>Save As</button>
    </div>
    <button id="exportBtn" disabled>Export New File</button>
  </header>
  <main>
    <div class="layout">
      <aside class="sidebar">
        <h2>Structure</h2>
        <div class="tree" id="sidebarTree"></div>
      </aside>
      <section>
        <div class="tree" id="tree"></div>
        <div class="status" id="status">Please import a locale JSON file.</div>
      </section>
    </div>
  </main>
  <script src="localstorage.js"></script>
  <script src="utils.js"></script>
</body>

</html>
